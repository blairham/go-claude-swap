version: 2

# GoReleaser configuration for go-claude-swap
# See: https://goreleaser.com
project_name: cswap

builds:
- id: cswap
  binary: cswap
  main: ./cmd/cswap
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ignore:
  - goos: windows
    goarch: arm64
  ldflags:
  - -s -w
  - -X github.com/blairham/go-claude-swap/internal/cmd.Version={{.Version}}
  - -X main.commit={{.Commit}}
  - -X main.date={{.Date}}

archives:
- id: default
  formats:
  - tar.gz
  # this name template makes the OS and Arch compatible with the results of uname.
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
  format_overrides:
  - goos: windows
    formats:
    - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
  - title: Features
    regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
    order: 0
  - title: Bug Fixes
    regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
    order: 1
  - title: Other
    order: 999
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^chore:'

# A formula (not a cask like the other tap entries) so the tap can carry a
# `service` block: `brew services start blairham/tap/cswap` then runs the
# auto-switch loop under launchd/systemd with keep-alive and start-at-login.
homebrew_casks:
- name: cswap
  repository:
    owner: blairham
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  directory: Casks
  homepage: https://github.com/blairham/go-claude-swap
  description: Multi-account manager for Claude Code (Go rewrite of claude-swap)
  license: MIT
  # Casks have no `service` stanza, unlike the formula this replaced. cswap
  # installs its own launchd/systemd unit, which is the documented path anyway
  # and works identically on Linux.
  caveats: |
    The auto-switch service is managed by cswap itself, not by `brew services`:

      cswap service install    # launchd (macOS) / systemd --user (Linux)
      cswap service status
  hooks:
    post:
      # Drop the download's quarantine flag, then ad-hoc sign ONLY if the
      # binary has no valid signature already. The guard matters: if a
      # notarize block is added later, `codesign --force` would replace a real
      # Developer ID signature with an ad-hoc one and undo the notarization.
      install: |
        if OS.mac?
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cswap"]
          if system_command("/usr/bin/codesign", args: ["-v", "#{staged_path}/cswap"]).exit_status != 0
            system_command "/usr/bin/codesign", args: ["--force", "--sign", "-", "#{staged_path}/cswap"]
          end
        end

release:
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/blairham/go-claude-swap/compare/{{ .PreviousTag }}...{{ .Tag }}
