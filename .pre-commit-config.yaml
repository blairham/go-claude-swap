# Pre-commit configuration for go-claude-swap
# Install: pre-commit install
# Run:     pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^build/
      - id: end-of-file-fixer
        exclude: ^build/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Go housekeeping
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # Toolchain pin invariant
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.1.0
    hooks:
      - id: check-go-version-sync

  # golangci-lint at commit time, via the upstream hooks (no local scripts).
  # `golangci-lint-fmt` applies every formatter configured in .golangci.yml
  # (gofumpt AND goimports, which `go-fumpt-repo` could not do);
  # `golangci-lint` lints only what changed since HEAD — the whole-repo,
  # enforced lint stays in CI, because --new-from-rev can't see whole-module
  # linters like `unused`. Keep `rev` in lockstep with go.mod's tool pin and
  # the CI action version.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      # The diff-scoped hook (`--new-from-rev HEAD`), deliberately: this runs on
      # every commit and should report what you just wrote, not the
      # repository's whole backlog.
      #
      # Keep `rev` in lockstep with go.mod's tool pin.
      - id: golangci-lint

      # The same upstream hook, told which base to diff against.
      # `--new-from-merge-base` overrides the entry's `--new-from-rev HEAD`
      # (measured), which is the whole reason this works on a clean checkout,
      # where the tree and HEAD are identical so the entry finds nothing.
      #
      # `stages: [manual]` keeps it out of every local commit, where the hook
      # above already reports what you are about to write and `--fix` corrects
      # it. CI asks for this one by name.
      - id: golangci-lint
        alias: golangci-lint-new
        name: golangci-lint (issues this change introduces)
        stages: [manual]
        args: [--new-from-merge-base=origin/main]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: ^build/

# Note: CI runs the `golangci-lint-new` alias above at the manual stage, so a
# pull request is gated on the issues it introduces. Nothing runs the whole
# repository; whole-module linters like `unused` are reported only for code
# the change touched.
