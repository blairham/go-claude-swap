version: 2

# GoReleaser configuration for go-claude-swap
# See: https://goreleaser.com
project_name: cswap

builds:
- id: cswap
  binary: cswap
  main: ./cmd/cswap
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ignore:
  - goos: windows
    goarch: arm64
  ldflags:
  - -s -w
  - -X github.com/blairham/go-claude-swap/internal/cmd.Version={{.Version}}
  - -X main.commit={{.Commit}}
  - -X main.date={{.Date}}

archives:
- id: default
  formats:
  - tar.gz
  # this name template makes the OS and Arch compatible with the results of uname.
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
  format_overrides:
  - goos: windows
    formats:
    - zip

# macOS signing + notarization, matching ghorg, stevedore and go-pre-commit.
# Gated on isEnvSet, so releases still succeed unsigned when the secrets are
# absent — which is the case until MACOS_SIGN_P12 and the notary key are added
# to this repo.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - cswap
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
  - title: Features
    regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
    order: 0
  - title: Bug Fixes
    regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
    order: 1
  - title: Other
    order: 999
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^chore:'

# A formula (not a cask like the other tap entries) so the tap can carry a
# `service` block: `brew services start blairham/tap/cswap` then runs the
# auto-switch loop under launchd/systemd with keep-alive and start-at-login.
# A formula, not a cask. cswap is the one tool here that ships a daemon, and
# only formulae have a `service` stanza — a cask cannot integrate with
# `brew services` at all. Formulae also work on Homebrew for Linux exactly as
# they do on macOS.
#
# GoReleaser marks `brews` deprecated in favour of `homebrew_casks`, on the
# grounds that formulae installing pre-compiled binaries are "hackyish" and
# were only needed because Linuxbrew could not handle casks. There is no
# announced removal date, and the Linuxbrew limitation is not our reason for
# using them.
#
# Note there is no quarantine hook here: casks flag their downloads with
# com.apple.quarantine and need it stripped, formulae do not.
brews:
- name: cswap
  repository:
    owner: blairham
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  directory: Formula
  homepage: https://github.com/blairham/go-claude-swap
  description: Multi-account manager for Claude Code (Go rewrite of claude-swap)
  license: MIT
  install: |
    bin.install "cswap"
  service: |
    run [opt_bin/"cswap", "auto"]
    keep_alive true
    log_path var/"log/cswap-auto.log"
    error_log_path var/"log/cswap-auto.log"
  test: |
    system "#{bin}/cswap", "--version"

release:
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/blairham/go-claude-swap/compare/{{ .PreviousTag }}...{{ .Tag }}
