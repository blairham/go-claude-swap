name: CI

# Everything that gates a merge is blairham/.github's go-ci.yml: Pre-commit,
# Detect changed files, Build and test (Ubuntu and macOS, because the
# credential store is the Keychain on one and a file on the other) and Fuzz.
# Its checks report as `CI / <job>`.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request built, so main gets its own run.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '41 5 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@48d6c8f94aa8381c550818e0a0b2a0d61f280a6b # v0.0.2
    with:
      os: '["ubuntu-latest", "macos-latest"]'
      # The cswap binary with its release ldflags, then everything else.
      build-command: make build && go build ./... && go vet ./...
