version: 2

# GoReleaser configuration for go-claude-swap
# See: https://goreleaser.com
project_name: cswap

builds:
  - id: cswap
    binary: cswap
    main: ./cmd/cswap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/blairham/go-claude-swap/internal/cmd.Version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

# macOS signing + notarization, matching ghorg, stevedore and go-pre-commit.
# Gated on isEnvSet, so releases still succeed unsigned when the secrets are
# absent — which is the case until MACOS_SIGN_P12 and the notary key are added
# to this repo.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - cswap
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

checksum:
  name_template: 'checksums.txt'

# Keyless cosign signatures from the release workflow's identity. Signing
# checksums.txt covers every archive. See SECURITY.md to verify.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The notes are the tag's CHANGELOG.md section, passed by release.yml
# (go-release.yml) with --release-notes, which replaces the generated commit
# list. Do not set `changelog.disable`: it skips the stage that reads
# --release-notes too.

# A formula, not a cask. cswap is the one tool here that ships a daemon, and
# only formulae have a `service` stanza — a cask cannot integrate with
# `brew services` at all: `brew services start blairham/tap/cswap` runs the
# auto-switch loop under launchd/systemd with keep-alive and start-at-login.
# Formulae also work on Homebrew for Linux exactly as they do on macOS.
#
# The formula builds from the source archive below (`brew install -s`) and
# pours bottles made from the release's darwin and linux cswap binaries, the
# way homebrew-core ships a CLI, rather than a formula that only downloads a
# prebuilt archive (what GoReleaser's deprecated `brews` produced).
# homebrew_bottles comes from blairham/goreleaser
# (goreleaser/goreleaser#7342), which release.yml selects with
# goreleaser-ref; official GoReleaser rejects this key.
#
# Note there is no quarantine hook here: casks flag their downloads with
# com.apple.quarantine and need it stripped, formulae do not.
homebrew_bottles:
  - name: cswap
    ids:
      - cswap
    repository:
      owner: blairham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/blairham/go-claude-swap
    description: Multi-account manager for Claude Code (Go rewrite of claude-swap)
    license: Apache-2.0
    # A prerelease does not move the formula.
    skip_upload: auto
    service: |
      run [opt_bin/"cswap", "auto", "--log-file", var/"log/cswap-auto.log"]
      keep_alive true
      log_path var/"log/cswap-auto.log"
      error_log_path var/"log/cswap-auto.log"
    test: |
      system "#{bin}/cswap", "--version"

# The tarball the formula's `url` points at, for building from source.
source:
  enabled: true

release:
  draft: false
  replace_existing_draft: true
  # No target_commitish: the tag already exists, and naming a commit makes
  # GitHub treat the release as a ref write. When the release range touches
  # .github/workflows, that needs the workflows permission GITHUB_TOKEN
  # cannot have, and creating the release fails with a 403.
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/blairham/go-claude-swap/compare/{{ .PreviousTag }}...{{ .Tag }}
